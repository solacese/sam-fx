[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sam-fx"
version = "0.1.0"
description = "Event-driven FX regime detection demo for Solace Agent Mesh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "groq>=0.31,<1",
  "httpx>=0.28,<1",
  "solace-pubsubplus>=1.10,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
fx-regime = "fx_regime.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_regime"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fx_regime"]

[[tool.mypy.overrides]]
module = ["solace.*"]
ignore_missing_imports = true
