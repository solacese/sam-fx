name: Publish FX operations demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: pytest && ruff check . && mypy src
        env:
          INCIDENT_STORE_PATH: ':memory:'
          ENABLE_EXTERNAL_PROVIDERS: 'false'
      - run: PYTHONPATH=src python scripts/build_pages.py
      - run: node scripts/test_pages.cjs && node scripts/test_chart.cjs
      # Package the standard Pages tar directly: the composite Pages uploader
      # contains an unpinned nested action, which this organization rejects.
      - name: Package Pages artifact
        run: tar --dereference --hard-dereference --directory dist/pages -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
